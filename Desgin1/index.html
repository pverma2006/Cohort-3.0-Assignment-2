<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section id="section_1">
        <nav class="nav">
          <div class="left">
            <img src="logo.png" alt="logo not found" />
            <h3>ScaleX</h3>
          </div>

          <div class="mid">
            <p>Home</p>
            <p>About Us</p>
            <p>Blogs</p>
            <p>Contact Us</p>
          </div>

          <div class="right">
            <p>Get Started</p>
          </div>
        </nav>
      </section>

      <section id="section_2">
        <div class="hero">
          <div class="header">
            <h1>Insights & Blogs</h1>
          </div>

          <div class="btn">
            <div class="btn-item"><button>All</button></div>
            <div class="btn-item"><button>Tech</button></div>
            <div class="btn-item"><button>SaaS</button></div>
            <div class="btn-item"><button>Marketing</button></div>
          </div>
        </div>
      </section>

      <section id="section_3">
        <div class="card">
          <div class="card-image">
            <img src="img1.png" alt="Not found" />
          </div>

          <div class="card-text">
            <button>Tech</button>
            <h3>The Ultimate Guide To<br />SaaS Marketing</h3>
            <h6>May 23, 2025</h6>
          </div>
        </div>

        <div class="card">
          <div class="card-image">
            <img src="img2.png" alt="Not found" />
          </div>

          <div class="card-text">
            <button>SaaS</button>
            <h3>5 Key Trends In SaaS<br>Growth For 2025</h3>
            <h6>May 23, 2025</h6>
          </div>
        </div>

        <div class="card">
          <div class="card-image">
            <img src="img3.png" alt="Not found" />
          </div>

          <div class="card-text">
            <button>Marketing</button>
            <h3>How Data-Driven<br>Strategies Are Important</h3>
            <h6>May 23, 2025</h6>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
